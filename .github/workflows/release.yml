name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.10.0)
        required: true
        type: string
      publish:
        description: Publish after verification (otherwise leave a draft)
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/src/rust-ue-tools
      - name: Validate release identity and signing configuration
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package version.' }
          $tagCommit = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout must match an existing version tag.' }
          if ($env:RELEASE_REPO -ne 'cort-robinson/RivalNxt') { throw 'Updater feed is scoped to cort-robinson/RivalNxt.' }
          if (-not $env:SIGNING_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $existing = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) { throw 'Published releases are immutable; use a new version.' }
          $global:LASTEXITCODE = 0
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-dev.txt maturin pyinstaller
      - name: Build native Python module
        shell: pwsh
        working-directory: src-tauri/src/rust-ue-tools
        run: |
          maturin build --release --features pyo3 --out wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          pip install $wheel.FullName --force-reinstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import rust_ue_tools"
      - name: Build pinned repair worker
        run: cargo build --release --locked --manifest-path tools/pak-repair/Cargo.toml
      - name: Verify source and versions
        run: |
          ruff check core scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pytest tests/ -q --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/verify-update.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Build and inspect backend
        run: |
          python -m PyInstaller --noconfirm --clean rivalnxt_backend_merged.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_bundle.py dist/rivalnxt_backend.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/sidecars | Out-Null
          Copy-Item dist/rivalnxt_backend.exe src-tauri/sidecars/rivalnxt_backend-x86_64-pc-windows-msvc.exe -Force
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build
      - name: Fetch previous release for upgrade verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force previous-release | Out-Null
          gh release download --repo $env:RELEASE_REPO --pattern '*_x64-setup.exe' --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify upgrade without the previous published installer.' }
      - name: Verify installer and upgrade on isolated runner
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/RivalNxt_$($env:RELEASE_VERSION)_x64-setup.exe"
          $previous = (Get-ChildItem previous-release/*_x64-setup.exe | Select-Object -First 1).FullName
          ./scripts/release-smoke.ps1 -Installer $installer -Version $env:RELEASE_VERSION -PreviousInstaller $previous
      - name: Prepare signed update feed and checksums
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/RivalNxt_$($env:RELEASE_VERSION)_x64-setup.exe"
          node scripts/verify-update.mjs $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-release-assets.py $installer $env:RELEASE_VERSION "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified assets to draft release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPO --verify-tag --draft --title "RivalNxt $env:RELEASE_TAG" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $bundle = 'src-tauri/target/release/bundle/nsis'
          gh release upload $env:RELEASE_TAG --repo $env:RELEASE_REPO "$bundle/RivalNxt_$($env:RELEASE_VERSION)_x64-setup.exe" "$bundle/RivalNxt_$($env:RELEASE_VERSION)_x64-setup.exe.sig" "$bundle/RivalNxt_$($env:RELEASE_VERSION)_x64-setup.exe.sha256" "$bundle/latest.json" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPO --notes-file "docs/releases/$($env:RELEASE_TAG).md"
      - name: Publish verified release
        if: inputs.publish
        run: gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPO --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            release-smoke-result.json
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/nsis/latest.json
            build/*.txt
          if-no-files-found: ignore
